name: Publish plugin to npm

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published GitHub Release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-plugin
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ (github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is on main
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor HEAD origin/main

      - name: Verify release metadata
        run: node scripts/release-metadata.mjs verify "$RELEASE_TAG"

      - name: Verify manually selected release is published
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.draft == false and .prerelease == false')" = true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release
        run: |
          pnpm lint
          pnpm test
          pnpm --filter @coderrob/eslint-plugin-zero-tolerance exec tsc -p tsconfig.json --noEmit
          pnpm --filter @coderrob/eslint-config-zero-tolerance exec tsc -p tsconfig.json --noEmit

      - name: Preview plugin package
        working-directory: packages/plugin
        run: npm pack --dry-run --ignore-scripts

      - name: Publish plugin
        working-directory: packages/plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo 'NPM_TOKEN secret is required for publishing' >&2; exit 1; }
          npm publish --access public --provenance --ignore-scripts
