name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.22.2', '26.13.0']
    name: Build and test (Node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Pack consumer-test artifacts
        run: |
          mkdir -p compatibility-packages
          pnpm --config.ignore-scripts=true --dir packages/plugin pack --json --pack-destination "$PWD/compatibility-packages"
          pnpm --config.ignore-scripts=true --dir packages/config pack --json --pack-destination "$PWD/compatibility-packages"

      - name: Validate packed package types and exports
        run: |
          pnpm exec attw compatibility-packages/coderrob-eslint-plugin-zero-tolerance-*.tgz --profile node16 --ignore-rules false-export-default
          pnpm exec attw compatibility-packages/coderrob-eslint-config-zero-tolerance-*.tgz --profile node16 --ignore-rules false-export-default

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node-version == '24.22.2'
        with:
          name: compatibility-packages
          path: compatibility-packages/*.tgz
          if-no-files-found: error

  package-compatibility:
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: '18.20.8'
            eslint-version: '8.57.1'
            config-style: legacy
          - node-version: '20.20.2'
            eslint-version: '9.39.5'
            config-style: flat
          - node-version: '22.23.4'
            eslint-version: '10.14.0'
            config-style: flat
          - node-version: '24.22.2'
            eslint-version: '10.14.0'
            config-style: flat
          - node-version: '26.13.0'
            eslint-version: '10.14.0'
            config-style: flat
    name: Package compatibility (Node ${{ matrix.node-version }}, ESLint ${{ matrix.eslint-version }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          cache: 'pnpm'

      - name: Install compatibility runner dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compatibility-packages
          path: compatibility-packages

      - name: Select consumer Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test packed package compatibility
        run: >-
          node scripts/test-package-compatibility.mjs
          --package-dir compatibility-packages
          --eslint-version ${{ matrix.eslint-version }}
          --config-style ${{ matrix.config-style }}
