name: Copyright Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Add Copyright Headers
        uses: CoderRob/add-copyright@ce8229af0a8e82a7376a96819a1e4c204cea58a7 # v2.0.0
        with:
          name: 'Robert Lindley'
          license: 'Apache-2.0'
          working-directory: 'packages'
